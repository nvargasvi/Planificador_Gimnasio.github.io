<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gym Routine Tracker 💪</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f0f0f0; }
    h1 { color: #2c3e50; }
    select, input, button { margin: 5px 0; padding: 8px; width: 100%; }
    .output { margin-top: 20px; white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>

  <h1>GYM ROUTINE TRACKER 💪</h1>

  <label for="opcion">Elige una opción:</label>
  <select id="opcion">
    <option value="1">1. Ver rutina del día</option>
    <option value="2">2. Agregar ejercicio a un día</option>
  </select>

  <div id="formulario">
    <!-- Aquí se cargan los formularios dinámicamente -->
  </div>

  <div class="output" id="salida"></div>

  <script>
    const rutinas = {
      lunes: [
        { ejercicio: "Sentadillas", series: 3, repeticiones: 12, peso: 50 },
        { ejercicio: "Press de banca", series: 4, repeticiones: 10, peso: 40 }
      ],
      martes: [
        { ejercicio: "Remo con barra", series: 3, repeticiones: 10, peso: 35 }
      ]
    };

    const opcionSelect = document.getElementById('opcion');
    const formularioDiv = document.getElementById('formulario');
    const salidaDiv = document.getElementById('salida');

    opcionSelect.addEventListener('change', mostrarFormulario);
    mostrarFormulario();

    function mostrarFormulario() {
      const opcion = opcionSelect.value;
      formularioDiv.innerHTML = '';
      salidaDiv.textContent = '';

      if (opcion === '1') {
        formularioDiv.innerHTML = `
          <input type="text" id="diaConsulta" placeholder="¿Qué día quieres ver? (ej: lunes)">
          <button onclick="verRutina()">Ver rutina</button>
        `;
      } else if (opcion === '2') {
        formularioDiv.innerHTML = `
          <input type="text" id="diaNuevo" placeholder="Día (ej: miercoles)">
          <input type="text" id="ejercicio" placeholder="Nombre del ejercicio">
          <input type="number" id="series" placeholder="Número de series">
          <input type="number" id="repeticiones" placeholder="Número de repeticiones">
          <input type="number" step="0.1" id="peso" placeholder="Peso (kg)">
          <button onclick="agregarEjercicio()">Agregar ejercicio</button>
        `;
      }
    }

    function verRutina() {
      const dia = document.getElementById('diaConsulta').value.toLowerCase();
      if (rutinas[dia] && rutinas[dia].length > 0) {
        let texto = `Rutina para ${dia.charAt(0).toUpperCase() + dia.slice(1)}:\n`;
        rutinas[dia].forEach(e => {
          texto += `- ${e.ejercicio} | ${e.series}x${e.repeticiones} @ ${e.peso} kg\n`;
        });
        salidaDiv.textContent = texto;
      } else {
        salidaDiv.textContent = "No hay ejercicios guardados para ese día.";
      }
    }

    function agregarEjercicio() {
      const dia = document.getElementById('diaNuevo').value.toLowerCase();
      const ejercicio = document.getElementById('ejercicio').value;
      const series = parseInt(document.getElementById('series').value);
      const repeticiones = parseInt(document.getElementById('repeticiones').value);
      const peso = parseFloat(document.getElementById('peso').value);

      const nuevo = { ejercicio, series, repeticiones, peso };

      if (!rutinas[dia]) rutinas[dia] = [];
      rutinas[dia].push(nuevo);

      salidaDiv.textContent = `✅ Se agregó '${ejercicio}' a la rutina del ${dia}.`;
    }
  </script>

</body>
</html>
